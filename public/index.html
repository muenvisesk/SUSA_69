<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการการลา | Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="brand-strip">
        <div class="logo-box">LM</div>
        <div>
          <div class="brand-name">LeaveFlow</div>
          <div class="brand-subtext">Leave Management System</div>
        </div>
      </div>

      <div class="card-header">
        <h2>เข้าสู่ระบบ</h2>
        <p>กรอกข้อมูลเพื่อเข้าถึงแผนกและใบลา</p>
      </div>

      <form id="loginForm">
        <label for="employeeCode">รหัสพนักงาน / Employee ID</label>
        <input id="employeeCode" placeholder="กรอก ID" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="กรอก Password" autocomplete="current-password" required>

        <button class="primary-btn" type="submit">เข้าสู่ระบบ</button>
        <p id="loginError" class="error-text"></p>
      </form>

      <div class="demo-box">
        <strong>บัญชีทดลอง</strong>
        <div>พนักงาน: EMP001 / 1234</div>
        <div>หัวหน้างาน: EMP006 / 1234</div>
        <div>หัวหน้าแผนก: EMP007 / 1234</div>
        <div>HR: EMP008 / 1234</div>
      </div>
    </section>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const error = document.getElementById("loginError");
      error.textContent = "";

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            employeeCode: document.getElementById("employeeCode").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "เข้าสู่ระบบไม่สำเร็จ");

        localStorage.setItem("user", JSON.stringify(data.user));
        window.location.href = "dashboard.html";
      } catch (err) {
        error.textContent = err.message;
      }
    });
  </script>
</body>
</html>
